name: Update videos and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore: ['_weekly/**', '_observations/**']
  workflow_dispatch:
  schedule:
    - cron: '17 0,4,10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test video and public topic updates
        run: |
          python3 -B test-fetch-fallback.py
          python3 -B test-youtube-api.py
          python3 -B test-public-news.py
          python3 -B test-observations.py
          node test-civic.cjs
          node test-civic-keywords.cjs
          node test-weekly.cjs
          node test-weekly-drafts.cjs
          node test-journey-cycle.cjs
          node test-journey-loading.cjs
          node test-note-diagrams.cjs
          node test-note-paste.cjs
          python3 -B test-weekly-publisher.py
      - name: Update long-term observation data
        run: python3 -B update-observations.py
      - name: Update public topic news recommendations
        run: python3 -B update-public-news.py
      - name: Fetch latest YouTube videos
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[update-videos]')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          python3 fetch-youtube-api.py
      - name: Save videos, recommendations and observation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/videos.json dist/public-news.json dist/observations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update videos and public topic recommendations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

