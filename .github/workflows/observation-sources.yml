name: Check public observation sources
on:
  push:
    branches: [main]
    paths: ['scripts/check-observation-sources.py', '.github/workflows/observation-sources.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-observation-sources.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _observations/source-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Check public observation source schemas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
