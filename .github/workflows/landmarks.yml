name: Prepare licensed landmark backgrounds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch-landmarks.py
      - dist/landmarks/catalog.json
permissions:
  contents: write
concurrency:
  group: landmark-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Commons photographs and attribution
        id: photographs
        continue-on-error: true
        run: python3 -B fetch-landmarks.py
      - name: Save available landmark assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/landmarks
          if ! git diff --cached --quiet; then
            git commit -m "Add licensed landmark backgrounds and credits"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report missing photographs
        if: steps.photographs.outcome == 'failure'
        run: exit 1
